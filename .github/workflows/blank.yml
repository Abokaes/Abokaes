# This is an optimized CI workflow configured for high performance and efficiency

name: CI

# Controls when the workflow will run
on:
  # Trigger on push to main, ignoring non-functional document updates to save execution time
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.jules/**'
      - '.Jules/**'
  # Trigger on PR to main, ignoring non-functional document updates to save execution time
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.jules/**'
      - '.Jules/**'

  # Allows manual triggering from the Actions tab
  workflow_dispatch:

# Cancel any in-progress runs of the same workflow on the same branch to save runner resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Enforce a strict job timeout to prevent hanging runs from consuming billed minutes
    timeout-minutes: 5

    steps:
      # Check out the repository using a pinned SHA to ensure security and immutability
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run a one-line script
        run: echo Hello, world!

      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
